<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 680"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">A complete binary tree and its array representation</title>
  <desc id="description">
    A six-node min-heap with values 2, 5, 8, 10, 7, and 12. Nodes are labeled
    with their array indexes. The final level fills from left to right, and a
    dashed seventh position shows where the next value would be inserted.
  </desc>

  <rect width="960" height="680" rx="28" fill="#0f172a" />

  <text
    x="56"
    y="62"
    fill="#f8fafc"
    font-family="Arial, sans-serif"
    font-size="28"
    font-weight="700"
  >
    Complete binary tree
  </text>
  <text
    x="56"
    y="94"
    fill="#94a3b8"
    font-family="Arial, sans-serif"
    font-size="17"
  >
    Every level fills from left to right with no gaps.
  </text>

  <g fill="none" stroke="#64748b" stroke-linecap="round" stroke-width="4">
    <path d="M 456 177 L 324 263" />
    <path d="M 504 177 L 636 263" />
    <path d="M 280 323 L 222 398" />
    <path d="M 320 323 L 378 398" />
    <path d="M 640 323 L 582 398" />
    <path d="M 680 323 L 738 398" stroke-dasharray="10 10" opacity="0.55" />
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(480 155)">
      <circle r="46" fill="#0284c7" />
      <text y="-2" fill="#ffffff" font-size="25" font-weight="700">2</text>
      <text y="22" fill="#dbeafe" font-size="14">index 0</text>
    </g>
    <g transform="translate(300 295)">
      <circle r="46" fill="#2563eb" />
      <text y="-2" fill="#ffffff" font-size="25" font-weight="700">5</text>
      <text y="22" fill="#dbeafe" font-size="14">index 1</text>
    </g>
    <g transform="translate(660 295)">
      <circle r="46" fill="#2563eb" />
      <text y="-2" fill="#ffffff" font-size="25" font-weight="700">8</text>
      <text y="22" fill="#dbeafe" font-size="14">index 2</text>
    </g>
    <g transform="translate(200 430)">
      <circle r="43" fill="#334155" stroke="#60a5fa" stroke-width="3" />
      <text y="-2" fill="#ffffff" font-size="23" font-weight="700">10</text>
      <text y="21" fill="#bfdbfe" font-size="13">index 3</text>
    </g>
    <g transform="translate(400 430)">
      <circle r="43" fill="#334155" stroke="#60a5fa" stroke-width="3" />
      <text y="-2" fill="#ffffff" font-size="23" font-weight="700">7</text>
      <text y="21" fill="#bfdbfe" font-size="13">index 4</text>
    </g>
    <g transform="translate(560 430)">
      <circle r="43" fill="#334155" stroke="#60a5fa" stroke-width="3" />
      <text y="-2" fill="#ffffff" font-size="23" font-weight="700">12</text>
      <text y="21" fill="#bfdbfe" font-size="13">index 5</text>
    </g>
    <g transform="translate(760 430)" opacity="0.65">
      <circle
        r="43"
        fill="none"
        stroke="#94a3b8"
        stroke-dasharray="8 8"
        stroke-width="3"
      />
      <text y="-4" fill="#cbd5e1" font-size="14">next open</text>
      <text y="17" fill="#94a3b8" font-size="13">index 6</text>
    </g>
  </g>

  <line x1="56" y1="507" x2="904" y2="507" stroke="#334155" stroke-width="2" />
  <text
    x="56"
    y="550"
    fill="#f8fafc"
    font-family="Arial, sans-serif"
    font-size="22"
    font-weight="700"
  >
    Array representation
  </text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(285 526)">
      <g fill="#1e293b" stroke="#475569" stroke-width="2">
        <rect x="0" y="0" width="72" height="58" rx="8" />
        <rect x="72" y="0" width="72" height="58" rx="8" />
        <rect x="144" y="0" width="72" height="58" rx="8" />
        <rect x="216" y="0" width="72" height="58" rx="8" />
        <rect x="288" y="0" width="72" height="58" rx="8" />
        <rect x="360" y="0" width="72" height="58" rx="8" />
        <rect
          x="432"
          y="0"
          width="72"
          height="58"
          rx="8"
          fill="none"
          stroke-dasharray="7 7"
        />
      </g>
      <g fill="#f8fafc" font-size="22" font-weight="700">
        <text x="36" y="36">2</text>
        <text x="108" y="36">5</text>
        <text x="180" y="36">8</text>
        <text x="252" y="36">10</text>
        <text x="324" y="36">7</text>
        <text x="396" y="36">12</text>
      </g>
      <g fill="#94a3b8" font-size="13">
        <text x="36" y="82">0</text>
        <text x="108" y="82">1</text>
        <text x="180" y="82">2</text>
        <text x="252" y="82">3</text>
        <text x="324" y="82">4</text>
        <text x="396" y="82">5</text>
        <text x="468" y="82">6</text>
      </g>
    </g>
  </g>

  <text
    x="56"
    y="643"
    fill="#94a3b8"
    font-family="Arial, sans-serif"
    font-size="15"
  >
    The dashed position is the next insertion point, preserving the complete
    shape.
  </text>
</svg>
